  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
nodeLinker: isolated
overrides:
  graphql: ^16.8.0
publicHoistPattern:
  - '@react-native/assets-registry'
strictPeerDependencies: false
patchedDependencies:
  drizzle-orm@0.40.1: patches/drizzle-orm@0.40.1.patch
